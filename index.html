<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070708" />
    <meta name="description" content="MILANA — TWO YEARS. Интерактивная история двух лет отношений." />
    <title>MILANA — TWO YEARS</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="site-shell">
      <canvas id="world" aria-hidden="true"></canvas>
      <div class="world-fallback" aria-hidden="true"><i></i><i></i><i></i><span></span></div>
      <div class="grain" aria-hidden="true"></div>

      <header class="topbar" aria-label="Навигация по истории">
        <a class="wordmark" href="#prologue" aria-label="В начало истории">M / M</a>
        <div class="topbar-meta"><span id="sceneIndex">00</span><span class="slash">/</span><span>25</span></div>
        <button class="sound-toggle" id="soundToggle" type="button" aria-pressed="false" aria-label="Включить или выключить звук"><span class="sound-dot"></span><span id="soundLabel">звук</span></button>
      </header>

      <main id="story" tabindex="-1"></main>

      <div class="secret-modal" id="secretModal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="secretTitle">
        <div class="secret-modal-inner"><button class="close-modal" type="button" aria-label="Закрыть">×</button><p class="eyebrow">скрытое воспоминание</p><h2 id="secretTitle">ONE MORE THING</h2><p id="secretText"></p><span class="secret-symbol">✦</span></div>
      </div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
      <div class="dev-overlay" id="devOverlay" hidden></div>
      <noscript><div class="noscript">Для этой истории нужен JavaScript. Включи его — здесь будут фотографии, цветы и письмо.</div></noscript>
    </div>
    <script type="module" src="./app.js?v=5750bdc"></script>
  </body>
</html>
