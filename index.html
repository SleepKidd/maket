/* Light editorial direction: the story stays cinematic, but the page is warm, airy and photographic. */
:root {
  --bg: #f5efe8;
  --paper: #fffaf5;
  --paper-deep: #eaded5;
  --wine: #fff8f2;
  --burgundy: #7b4052;
  --rose: #b45f73;
  --ivory: #2c2528;
  --cream: #76585a;
  --muted: rgba(44, 37, 40, .68);
  --faint: rgba(44, 37, 40, .42);
  --line: rgba(112, 78, 83, .22);
  --accent: #c18c62;
}

html { background: var(--bg); color-scheme: light; }

.scene::after { border-bottom-color: rgba(112, 78, 83, .18); }
.scene-kicker { color: var(--faint); }
.eyebrow, .slot-meta { color: var(--rose); }

.begin-button:hover, .begin-button:focus-visible, .voice-button:hover, .voice-button:focus-visible { border-color: var(--burgundy); }
.button-dot { border-color: var(--rose); box-shadow: 0 0 0 4px rgba(180, 95, 115, .12); }

.play-mark { border-color: var(--rose); color: var(--rose); }
.silk-field { background: linear-gradient(105deg, transparent 18%, rgba(139, 82, 105, .16) 34%, rgba(255, 250, 245, .84) 47%, rgba(164, 196, 155, .2) 59%, transparent 77%); }
.love-list span { color: var(--ivory); }
.love-list span:nth-child(2) { color: var(--rose); }
